$terminal = app2unit kitty
$fileManager = app2unit dolphin
$web = app2unit zen-browser
$editor = app2unit neovide
$ipc = qs -c noctalia-shell ipc call

$mainMod = SUPER

bind = $mainMod, T, exec, $terminal
bind = $mainMod_SHIFT, E, exec, $editor
bind = $mainMod, Q, killactive,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, F, exec, $web
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $ipc launcher toggle 
bind = $mainMod, J, togglesplit,
bind = $mainMod, space, fullscreen, 1
bind = $mainMod_SHIFT, space, fullscreen, 2
bind = $mainMod, C, exec, $ipc controlCenter toggle
bind = $mainMod, tab, exec, $ipc launcher windows
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, S, exec, ~/.config/hypr/screenshot.sh 
bind = $mainMod, comma, exec, $ipc settings toggle
bind = Ctrl+Alt, Delete, exec, $ipc sessionMenu toggle
bindr = Ctrl+Alt+Shift, Q, exec, $ipc toast send '{"title": "Restarting shell", "body": "Noctalia shell is restarting"}'; sleep 1; killall qs; sleep 0.5; qs -c noctalia-shell

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod_SHIFT, left, movewindow, l
bind = $mainMod_SHIFT, right, movewindow, r
bind = $mainMod_SHIFT, up, movewindow, u
bind = $mainMod_SHIFT, down, movewindow, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bind = , Insert, exec, quodlibet
bind = , XF86AudioRaiseVolume, exec, $ipc volume increase
bind = , XF86AudioLowerVolume, exec, $ipc volume decrease
bind = , XF86AudioMute, exec, $ipc volume muteOutput
bind = , XF86MonBrightnessUp, exec, $ipc brightness increase
bind = , XF86MonBrightnessDown, exec, $ipc brightness decrease

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Turn off screen when closing
bindl = , switch:on:Lid Switch, exec, hyprctl keyword monitor "eDP-1, disable"
bindl = , switch:off:Lid Switch, exec, hyprctl keyword monitor "eDP-1, preferred, auto, 2"
