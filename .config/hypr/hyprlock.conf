background {
    monitor =
    path = /usr/share/backgrounds/catppuccin_triangle.png
}

label {
    monitor =
    text = 󰥔 $TIME
    text_align = center
    color = rgb(cad3f5)
    font_size = 24
    font_family = MesloLGS Nerd Font Bold
    rotate = 0
    position = 10, -10
    halign = left
    valign = top
}

label {
    monitor =
    text = cmd[update:1000] echo  $(date +"%A, %B %d %Y")
    text_align = center
    color = rgb(cad3f5)
    font_size = 24
    font_family = MesloLGS Nerd Font Bold
    rotate = 0
    position = 0, -10
    halign = center
    valign = top
}

label {
    monitor =
    text = cmd[update:1000] echo  $USER' '󰁹 $(upower -i /org/freedesktop/UPower/devices/battery_BAT0 | grep percentage | awk '{print $2}')
    text_align = center
    color = rgb(cad3f5)
    font_size = 24
    font_family = MesloLGS Nerd Font Bold
    rotate = 0
    position = -20, -10
    halign = right
    valign = top
}

input-field {
    monitor =
    size = 700, 70
    outline_thickness = 3
    dots_size = 0.33 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.15 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rounding = -1 # -1 default circle, -2 follow input-field rounding
    outer_color = rgb(313244)
    inner_color = rgb(313244)
    font_color = rgb(cad3f5)
    fade_on_empty = true
    fade_timeout = 1000 # Milliseconds before fade_on_empty is triggered.
    placeholder_text = <b>Placez sur le lecteur d’empreintes</b>
    font_family = MesloLGS Nerd Font
    hide_input = false
    rounding = -1 # -1 means complete rounding (circle/oval)
    check_color = rgb(eed49f)
    fail_color = rgb(ee99a0) # if authentication failed, changes outer_color and fail message color
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i> # can be set to empty
    fail_transition = 300 # transition time in ms between normal outer_color and fail_color
    capslock_color = -1
    bothlock_color = -1 # when both locks are active. -1 means don't change outer color (same for above)
    invert_numlock = false # change color if numlock is off
    swap_font_color = false # see below

    position = 0, 60
    halign = center
    valign = bottom
}
