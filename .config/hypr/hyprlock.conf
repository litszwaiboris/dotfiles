source = ~/.config/hypr/noctalia/noctalia-colors.conf

background {
    monitor =
    path = screenshot
		blur_passes = 2
		brightness = 0.5
}

# Time-Hour
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%H")</span>"
    color = rgba(255, 255, 255, 1)
    font_size = 125
    font_family = StretchPro
    position = -80, 190
    halign = center
    valign = center
}

# Time-Minute
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%M")</span>"
    color = $primary
    font_size = 125
    font_family = StretchPro
    position = 0, 70
    halign = center
    valign = center
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%d %B, %a.")"
    color = rgba(255, 255, 255, 100)
    font_size = 22
    font_family = Suisse Int'l Mono
    position = 20, -8
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text =   $USER
    color = rgba(216, 222, 233, 0.80)
    font_size = 22
    font_family = MesloLGS Nerd Font
    position = 0, -220
    halign = center
    valign = center
}


# INPUT FIELD
input-field {
    monitor =
    size = 500, 60
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    font_family = SF Pro Display Bold
    placeholder_text = <i><span foreground="##ffffff99">🔒 Saisie le mot de passe</span></i>
    hide_input = false
    position = 0, -290
    halign = center
    valign = center
}

# BATTERY
label {
    monitor =
    text = cmd[update:1000] echo 󰁹 $(cat /sys/class/power_supply/BAT0/capacity)%
    text_align = center
    color = rgba(216, 222, 233, 0.80)
    font_size = 20
    font_family = MesloLGS Nerd Font
    rotate = 0
    position = -30, -10
    halign = right
    valign = top
}

# CURRENT SONG
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/music.sh)" 
    color = rgba(147, 196, 255, 1)
    font_size = 18
    font_family = JetBrains Mono Nerd
    position = 0, 20
    halign = center
    valign = bottom
}

auth {
  fingerprint {
	  enabled = true
  }
}
